<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Search App + SDK Loader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body, html { height: 100%; width: 100%; background: #000; color: #fff; overflow: hidden; position: fixed; }
        
        /* Фон */
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4; background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/7E068F8D-434C-4D58-A6EB-587EF192B1E6%20(1).webp') center/cover no-repeat; }

        /* ЭКРАН ЗАГРУЗКИ SDK */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0c0c0c; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.5s; }
        
        .loader-box { width: 240px; text-align: center; }
        .p-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; position: relative; }
        
        /* Сама полоска */
        #p-bar { height: 100%; width: 0%; transition: width 0.3s ease, background-color 0.3s; background: #00d4ff; box-shadow: 0 0 10px #00d4ff; }
        
        /* Текст статуса */
        #status-text { margin-top: 10px; font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; font-family: monospace; }

        /* Интерфейс */
        #main { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; padding: 20px; opacity: 0; transition: opacity 0.5s; }
        .glass { width: 100%; max-width: 500px; height: 85vh; background: rgba(20, 20, 20, 0.85); border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); overflow: hidden; }

        .search-area { padding: 15px; display: flex; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .search-area input { flex: 1; border: 1px solid rgba(255,255,255,0.2); outline: 0; padding: 12px; font-size: 16px; border-radius: 12px; color: #fff; background: rgba(0,0,0,0.5); }
        .btn-search { background: #00d4ff; color: #000; border: none; padding: 0 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        #res { flex: 1; overflow-y: auto; padding: 15px; }

        /* Таблица статусов */
        .status-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.03); border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
        .status-table th { text-align: left; padding: 10px; font-size: 11px; color: #00d4ff; background: rgba(0, 212, 255, 0.1); text-transform: uppercase; }
        .status-table td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .c-err { color: #ff4b4b; }
        .c-ok { color: #00ff88; }
        .c-warn { color: #ffcc00; }
    </style>
</head>
<body>
    <div id="bg-container"></div>

    <div id="splash">
        <div class="loader-box">
            <h2 style="font-weight: 300; font-size: 18px;">illich TV</h2>
            <div class="p-track">
                <div id="p-bar"></div>
            </div>
            <p id="status-text">Инициализация...</p>
        </div>
    </div>

    <div id="main">
        <div class="glass">
            <div class="search-area">
                <input type="text" id="sInp" placeholder="Логин...">
                <button class="btn-search" onclick="runSearch()">ПОИСК</button>
            </div>
            <div id="res">
                <p style="text-align:center; opacity:0.4; margin-top:50px;">Ожидание ввода...</p>
            </div>
        </div>
    </div>

    <script>
        const G = i => document.getElementById(i);
        const S = supabase.createClient('https://qklkjobkymwsevnzlrzj.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbGtqb2JreW13c2V2bnpscnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjE0OTksImV4cCI6MjA4NjUzNzQ5OX0.DYwygDJ-fvcDP1UUefWjbhcB3OTdAzR9gj-Qi30BYnA');
        
        let sdkStatus = "waiting"; // waiting, loaded, error

        // === ЛОГИКА ШКАЛЫ ЗАГРУЗКИ ===
        function startLoadingSystem() {
            const bar = G('p-bar');
            const txt = G('status-text');
            let width = 0;

            // 1. Запускаем имитацию загрузки до 70%
            const fakeLoad = setInterval(() => {
                if (width < 70 && sdkStatus === "waiting") {
                    width += Math.random() * 5;
                    bar.style.width = width + '%';
                    txt.innerText = "Подключение SDK... " + Math.floor(width) + "%";
                }
            }, 100);

            // 2. Реально создаем и грузим скрипт
            const script = document.createElement('script');
            script.src = "https://sad.adsgram.ai/js/adsgram-ad-sdk.js";
            script.async = true;

            // Если загрузился успешно
            script.onload = () => {
                clearInterval(fakeLoad);
                sdkStatus = "loaded";
                bar.style.width = "100%";
                bar.style.background = "#00ff88"; // Зеленый
                bar.style.boxShadow = "0 0 15px #00ff88";
                txt.innerText = "SDK ЗАГРУЖЕН УСПЕШНО";
                txt.style.color = "#00ff88";
                setTimeout(openApp, 800);
            };

            // Если ошибка (блокировщик или нет сети)
            script.onerror = () => {
                clearInterval(fakeLoad);
                sdkStatus = "error";
                bar.style.width = "100%";
                bar.style.background = "#ff4b4b"; // Красный
                bar.style.boxShadow = "0 0 15px #ff4b4b";
                txt.innerText = "ОШИБКА: SDK НЕ ДОСТУПЕН";
                txt.style.color = "#ff4b4b";
                // Все равно пускаем в приложение через 1.5 сек
                setTimeout(openApp, 1500);
            };

            document.head.appendChild(script);
        }

        function openApp() {
            G('splash').style.opacity = '0';
            setTimeout(() => {
                G('splash').style.display = 'none';
                G('main').style.display = 'flex';
                setTimeout(() => G('main').style.opacity = '1', 50);
                
                // Если была ошибка, выводим её сразу в таблицу результатов
                if(sdkStatus === 'error') {
                    G('res').innerHTML = `
                        <table class="status-table">
                            <tr><th>СИСТЕМА</th><th>СТАТУС</th></tr>
                            <tr><td>Adsgram SDK</td><td class="c-err">Не загружен</td></tr>
                            <tr><td>Совет</td><td style="font-size:11px">Выключите VPN или AdBlock</td></tr>
                        </table>`;
                }
            }, 500);
        }

        // Запуск при старте страницы
        startLoadingSystem();

        // === ПОИСК И РЕКЛАМА ===
        function runSearch() {
            const val = G('sInp').value.trim();
            const out = G('res');

            // Очищаем и показываем статус
            out.innerHTML = '<p style="text-align:center; color:#00d4ff;">Подготовка...</p>';

            // Если SDK сломан, просто ищем в базе
            if (!window.Adsgram) {
                out.innerHTML = `
                    <table class="status-table">
                        <tr><th>ОШИБКА</th><th>ДЕТАЛИ</th></tr>
                        <tr><td>Реклама</td><td class="c-err">SDK недоступен</td></tr>
                    </table>`;
                if(val) doSearch(val);
                return;
            }

            // Показ рекламы
            const AdController = window.Adsgram.init({ blockId: "int-22923" });
            
            AdController.show().then((result) => {
                // Успех
                out.innerHTML = `
                    <table class="status-table">
                        <tr><th>РЕКЛАМА</th><th>СТАТУС</th></tr>
                        <tr><td>Просмотр</td><td class="c-ok">Успешно</td></tr>
                    </table>`;
                if(val) doSearch(val);
            }).catch((result) => {
                // Ошибка или пропуск
                const errName = result.error ? result.error : "unknown";
                out.innerHTML = `
                    <table class="status-table">
                        <tr><th>РЕКЛАМА</th><th>СТАТУС</th></tr>
                        <tr><td>Ошибка</td><td class="c-err">${errName}</td></tr>
                    </table>`;
                if(val) doSearch(val);
            });
        }

        async function doSearch(val) {
            const out = G('res');
            try {
                const { data, error } = await S.from('profiles').select('*').ilike('login', `%${val}%`);
                if (data && data.length > 0) {
                    let h = `<table class="status-table" style="margin-top:10px"><tr><th>ЛОГИН</th><th>ID</th></tr>`;
                    data.forEach(u => h+=`<tr><td>${u.login}</td><td style="opacity:0.5;font-size:11px">${u.id.slice(0,8)}...</td></tr>`);
                    h += `</table>`;
                    out.innerHTML += h;
                } else {
                    out.innerHTML += `<p style="text-align:center; opacity:0.5; margin-top:15px">Ничего не найдено</p>`;
                }
            } catch (e) {
                out.innerHTML += `<p style="color:red; text-align:center">Ошибка БД</p>`;
            }
        }
    </script>
</body>
</html>
