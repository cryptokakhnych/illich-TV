<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Illich TV</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%;
            background: #000; 
            color: white;
            overflow: hidden;
            position: fixed;
        }

        /* Фиксированный фон, который не реагирует на клавиатуру */
        .background-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/B27771DC-EBA0-4BCB-8EE0-CC0E6B370598.png') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        /* ЭКРАН ЗАГРУЗКИ */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/675D03F8-DE2B-4844-9B3F-011C5811F4EA.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .loader-wrapper {
            width: 60%;
            max-width: 300px;
            margin-bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        #loader-number {
            font-size: 18px;
            font-weight: 800;
            color: #00d4ff;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 10px rgba(0, 212, 255, 0.8);
            letter-spacing: 1px;
        }

        .loader-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.5);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ffffff);
            box-shadow: 0 0 20px #00d4ff;
            transition: width 2.5s linear;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ (Профиль и Выход) */
        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 10px #00d4ff;
        }

        .logout-btn {
            padding: 8px 15px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4e50;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 78, 80, 0.5);
        }

        /* ГЛАВНЫЙ ЭКРАН */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 8vh; /* ПАНЕЛЬ ПОДНЯТА ВЫШЕ */
            opacity: 0;
            transition: opacity 1s ease;
        }

        .search-group {
            width: 90%;
            max-width: 600px;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .search-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 20px;
            font-size: 16px;
            background: transparent;
            color: #222;
        }

        .search-btn {
            background: #00d4ff;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #results-container {
            width: 95%;
            max-width: 800px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            overflow-y: auto;
            max-height: 75vh;
            padding: 10px;
            scrollbar-width: none;
        }
        #results-container::-webkit-scrollbar { display: none; }

        .anime-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }
        .anime-card img { width: 100%; border-radius: 8px; margin-bottom: 5px; }
        .anime-card div { font-size: 12px; font-weight: 600; height: 30px; overflow: hidden; }
    </style>
</head>
<body onclick="closeKeyboard(event)">

    <div class="background-fixed"></div>

    <div id="splash-screen">
        <div class="loader-wrapper">
            <div id="loader-number">0%</div>
            <div class="loader-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="profile-icon">👤</div>
            <button class="logout-btn" onclick="location.reload()">Выход</button>
        </div>

        <div class="search-group" onclick="event.stopPropagation()">
            <input type="text" id="searchInput" placeholder="Найти аниме..." autocomplete="off">
            <button class="search-btn" onclick="executeSearch()">ПОИСК</button>
        </div>
        
        <div id="results-container"></div>
    </div>

    <script>
        function closeKeyboard(e) {
            document.getElementById('searchInput').blur();
        }

        // Следим за вводом: если пусто - удаляем результаты
        document.getElementById('searchInput').addEventListener('input', function() {
            if (this.value.trim() === "") {
                document.getElementById('results-container').innerHTML = "";
            }
        });

        function init() {
            const bar = document.getElementById('progress-bar');
            const num = document.getElementById('loader-number');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            const duration = 2500;
            const startTime = Date.now();
            bar.style.width = '100%';

            const timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / duration) * 100, 100);
                num.innerText = Math.floor(progress) + '%';

                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            main.style.display = 'flex';
                            setTimeout(() => main.style.opacity = '1', 50);
                        }, 800);
                    }, 300);
                }
            }, 16);
        }

        window.onload = init;

        async function executeSearch() {
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            const container = document.getElementById('results-container');
            
            if (!query) {
                container.innerHTML = "";
                return;
            }

            input.blur();
            container.innerHTML = '<p style="text-align:center; width:100%; color:#00d4ff;">Загрузка...</p>';

            try {
                const response = await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(query)}&limit=15&order=popularity`);
                const data = await response.json();
                container.innerHTML = ''; 

                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">Ничего не найдено</p>';
                    return;
                }

                data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="https://shikimori.one${anime.image.preview}" alt="img">
                        <div>${anime.russian || anime.name}</div>
                    `;
                    card.onclick = (e) => {
                        e.stopPropagation();
                        alert(`Shikimori ID: ${anime.id}`);
                    };
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<p style="text-align:center; width:100%; color:red;">Ошибка сети</p>';
            }
        }
        
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') executeSearch();
        });
    </script>
</body>
</html>
