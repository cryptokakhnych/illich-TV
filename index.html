const S=supabase.createClient('https://qklkjobkymwsevnzlrzj.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbGtqb2JreW13c2V2bnpscnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjE0OTksImV4cCI6MjA4NjUzNzQ5OX0.DYwygDJ-fvcDP1UUefWjbhcB3OTdAzR9gj-Qi30BYnA');
const G=i=>document.getElementById(i), LS=localStorage, J=JSON;
let hist=J.parse(LS.getItem('animeHistory'))||[], fav=J.parse(LS.getItem('animeFavorites'))||[], fTops=[], 
uProf={login:'Пользователь',email:'',password:'',dob:'01.01.2000',nat:'Планета Земля',isAnon:!1};

if(window.visualViewport){
    window.visualViewport.addEventListener('resize', () => {
        const fix = document.querySelector('.c-fix');
        if(fix) {
            const kbHeight = window.innerHeight - window.visualViewport.height;
            // Устанавливаем положение в зависимости от высоты клавиатуры

window.addEventListener('load',()=>{
    document.documentElement.style.setProperty('--fh', window.innerHeight+'px');

});

}

async function pAuth(){
    const e=G('a-em').value, p=G('a-ps').value; if(!e) return;

function logout(){LS.removeItem('illich_is_logged_in');LS.removeItem('user_email');G('u-menu').style.display='none';G('g-menu').style.display='block';G('a-frm').style.display='none';goHome();}

    clearTimeout(sTm);const b=G('m-back');
    if(v.trim().length>0){b.style.display='block';isS=!0;cMode='search';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('c-lbl').innerText="Результаты поиска";sTm=setTimeout(()=>search(),300);}

}
function swTab(t){
    G('t-rec').classList.toggle('active',t==='recommendations');G('t-new').classList.toggle('active',t==='new');G('t-hst').classList.toggle('active',t==='history');
    if(t==='recommendations')rPg=1;if(t==='new')nPg=1;loadHome(t);
}
function goHome(){
    G('m-back').style.display='none';G('glass').style.height='calc(var(--fh) - 185px)';G('glass').style.overflow='hidden';G('t-bar').style.display='flex';G('gl-back').style.display='none';G('h-tabs').style.display='flex';G('c-head').style.display='none';
    if(cMode==='topic'){opForum();return;}
    isS=!1;G('sInp').value='';cKey();swTab('recommendations');
}
async function loadHome(t,app=0){
    cMode=t;const res=G('res'),lbl=G('c-lbl');
    if(t==='history'){lbl.innerText="История просмотров";res.innerHTML='';if(!hist.length)res.innerHTML='<p style="text-align:center;padding:40px;opacity:.3;font-size:12px">Вы еще ничего не смотрели</p>';else hist.forEach(a=>res.appendChild(mkCard(a)));fade();return;}
    lbl.innerText=t==='recommendations'?"Рекомендации":"Новинки";
    if(!app)res.innerHTML='<p style="text-align:center;padding:20px">Загрузка...</p>';else ldAll=!0;
    let o=t==='recommendations'?'popularity':'id',p=t==='recommendations'?rPg:nPg;
    try{
        const r=await fetch(`https://shikimori.one/api/animes?limit=20&order=${o}&page=${p}`),data=await r.json();
        if(!app)res.innerHTML='';data.forEach(a=>res.appendChild(mkCard({id:a.id,title:a.russian||a.name,img:`https://shikimori.one${a.image.preview}`})));
        if(t==='recommendations')rPg++;else nPg++;if(!app)fade();
    }catch(e){if(!app)res.innerHTML='<p style="text-align:center;padding:20px">Ошибка сети</p>';}ldAll=!1;
}
function mkCard(a){
    const d=document.createElement('div'),favd=fav.some(f=>String(f.id)===String(a.id));
    d.className='card';
    d.innerHTML=`<img src="${a.img}" onclick="opInfo('${a.id}','${a.title.replace(/'/g,"\\'")}','${a.img}')"><div onclick="opInfo('${a.id}','${a.title.replace(/'/g,"\\'")}','${a.img}')">${a.title}</div><button class="fav-btn ${favd?'fav-act':''}" onclick="tgFav(event,'${a.id}','${a.title.replace(/'/g,"\\'")}','${a.img}')">${favd?'❤️':'🤍'}</button>`;
    return d;
}
async function opInfo(id, title, img) {
    cMode = 'info';
    const res = G('res');
    res.innerHTML = '<p style="text-align:center;padding:20px">Загрузка данных...</p>';
    G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('c-lbl').innerText="О аниме";
    try {
        const r = await fetch(`https://shikimori.one/api/animes/${id}`);
        const a = await r.json();
        res.innerHTML = `
            <div style="padding:10px; display:flex; flex-direction:column; gap:15px;">
                <img src="https://shikimori.one${a.image.original}" class="info-img">
                <h2 style="color:#00d4ff; text-align:center;">${a.russian || a.name}</h2>
                <div style="display:flex; justify-content:space-around; font-size:12px; color:#00d4ff; font-weight:700;">
                    <span>⭐ ${a.score}</span><span>🎬 ${a.episodes} эп.</span><span>📅 ${a.aired_on.split('-')[0]}</span>
                </div>
                <div class="info-desc">${a.description || 'Описание отсутствует.'}</div>
                <button class="btn" style="font-size:16px; margin-top:10px;" onclick="play('${id}','${title.replace(/'/g,"\\'")}','${img}')">СМОТРЕТЬ</button>
                <button class="btn" style="background:#333; margin-top:5px;" onclick="goHome()">НАЗАД</button>
            </div>
        `;
        fade();
    } catch(e) { res.innerHTML = '<p style="text-align:center;padding:20px">Ошибка загрузки</p>'; }
}
async function search(q=null){
    const v=q||G('sInp').value;if(!v&&!q)return;const res=G('res');
    res.innerHTML='<p style="text-align:center;padding:20px">Загрузка...</p>';
    try{const r=await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(v)}&limit=20`),d=await r.json();res.innerHTML='';if(!d.length){res.innerHTML='<p style="text-align:center;padding:20px">Не найдено</p>';return;}d.forEach(a=>res.appendChild(mkCard({id:a.id,title:a.russian||a.name,img:`https://shikimori.one${a.image.preview}`})));fade();}catch(e){res.innerHTML='<p style="text-align:center;padding:20px">Ошибка</p>';}
}
function isAu(){if(LS.getItem('illich_is_logged_in')!=='true'){alert("Раздел доступен только авторизованным пользователям.");return 0;}return 1;}
function opAll(){
    if(!isAu())return;hideMenu();cMode='all-anime';aPg=1;G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText="Все аниме";G('res').innerHTML='<p style="text-align:center;padding:20px">Загрузка списка...</p>';ldAllAn();fade();
}
async function ldAllAn(app=0){
    if(ldAll)return;ldAll=!0;try{const r=await fetch(`https://shikimori.one/api/animes?limit=50&order=popularity&page=${aPg}`),d=await r.json(),res=G('res');if(!app)res.innerHTML='';if(d.length){d.forEach(a=>res.appendChild(mkCard({id:a.id,title:a.russian||a.name,img:`https://shikimori.one${a.image.preview}`})));aPg++;}}catch(e){}ldAll=!1;
}
function opFav(){
    if(!isAu())return;hideMenu();cMode='favorites';G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText="Избранные";renFav();fade();
}
function renFav(){const r=G('res');r.innerHTML='';if(!fav.length){r.innerHTML='<p style="text-align:center;padding:40px;opacity:.3;font-size:12px">Нет избранных</p>';return;}fav.forEach(a=>r.appendChild(mkCard(a)));}
function tgFav(e,id,tit,img){e.stopPropagation();const i=fav.findIndex(f=>String(f.id)===String(id));if(i>-1){fav.splice(i,1);e.target.innerText='🤍';e.target.classList.remove('fav-act');if(cMode==='favorites')renFav();}else{fav.unshift({id,title:tit,img});e.target.innerText='❤️';e.target.classList.add('fav-act');}LS.setItem('animeFavorites',J.stringify(fav));}
function opProf(){
    if(!isAu())return;hideMenu();cMode='profile';G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText="Профиль";
    const r=G('res'),an=uProf.isAnon?'Аноним':'Не аноним',ac=uProf.isAnon?'anon-act':'';
    r.innerHTML=`<div class="p-view"><div class="p-row"><span class="p-lbl">Логин</span><input type="text" id="e-log" class="p-inp" value="${uProf.login}" onfocus="pScr(1)" onblur="pScr(0)"></div><div class="p-row"><span class="p-lbl">Email</span><input type="email" id="e-em" class="p-inp" value="${uProf.email}" onfocus="pScr(1)" onblur="pScr(0)"></div><div class="p-row"><span class="p-lbl">Дата рождения</span><input type="text" id="e-dob" class="p-inp" value="${uProf.dob}" onfocus="pScr(1)" onblur="pScr(0)"></div><div class="p-row"><span class="p-lbl">Национальность</span><input type="text" id="e-nat" class="p-inp" value="${uProf.nat}" onfocus="pScr(1)" onblur="pScr(0)"></div><div class="p-row"><span class="p-lbl">Пароль</span><input type="password" id="e-ps" class="p-inp" value="${uProf.password}" onfocus="pScr(1)" onblur="pScr(0)"></div><div class="p-row"><span class="p-lbl">Режим форума</span><button class="anon-btn ${ac}" onclick="tgAnon()">${an}</button></div><button id="sv-p-btn" class="sv-btn" onclick="svProf()">СОХРАНИТЬ</button><div style="height:100px"></div></div>`;fade();
}
function pScr(on){const g=G('glass');if(on){g.style.height='calc(var(--fh) - 250px)';g.style.overflowY='auto';}else{setTimeout(()=>{g.style.height='calc(var(--fh) - 120px)';g.style.overflow='hidden';},100);}}
async function svProf(){
    uProf.login=G('e-log').value;uProf.email=G('e-em').value;uProf.dob=G('e-dob').value;uProf.nat=G('e-nat').value;uProf.password=G('e-ps').value;
    await S.from('profiles').upsert({id:uProf.email,login:uProf.login,email:uProf.email,password:uProf.password,dob:uProf.dob,nat:uProf.nat,is_anon:uProf.isAnon});
    alert("Профиль сохранен");
}
async function tgAnon(){uProf.isAnon=!uProf.isAnon;await S.from('profiles').upsert({id:uProf.email,is_anon:uProf.isAnon});opProf();}
async function opForum(){
    if(!isAu())return;hideMenu();cMode='forum';delMode=!1;G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText="Форум";
    const r=G('res'),adm=(uProf.login===ADMIN);
    r.innerHTML=`<div class="f-head"><div class="f-tool"><input type="text" id="f-s-inp" class="f-inp" placeholder="Поиск темы..."><div class="f-grp"><div class="btn" style="padding:0 10px;display:flex;align-items:center" onclick="fltTop(G('f-s-inp').value)">ПОИСК</div><div class="f-add" onclick="tgTopF()">+</div><div class="f-del" id="adm-del" style="display:${adm?'flex':'none'}" onclick="tgDel()">-</div></div></div></div><div id="nt-area" style="display:none"><div class="nt-form"><input type="text" id="nt-tit" class="new-top-inp" placeholder="Название темы"><button class="nt-btn" onclick="crTop()">Создать тему</button></div></div><div id="t-list" style="padding:10px"></div>`;
    const{data}=await S.from('forum_topics').select('*').order('created_at',{ascending:!1});fTops=data||[];rnTop();fade();
}
function rnTop(f=''){
    const l=G('t-list');l.innerHTML='';const fd=fTops.filter(t=>t.title.toLowerCase().includes(f.toLowerCase()));
    fd.forEach(t=>{const d=document.createElement('div');d.className='t-card';d.innerHTML=`<span class="t-tit">${t.title}</span>`+(delMode?`<button class="t-del" onclick="delTop(${t.id})">🗑️</button>`:`<button class="t-sel" onclick="opTop(${t.id})">Выбрать</button>`);l.appendChild(d);});
}
async function opTop(id){
    cMode='topic';cTId=id;G('glass').style.height='calc(var(--fh) - 120px)';
    const t=fTops.find(x=>x.id===id);G('c-lbl').innerText=t.title;
    G('res').innerHTML=`<div class="chat-wrp"><div class="chat-c" id="c-msgs"></div><div class="c-fix"><input type="text" id="chat-in" class="chat-inp" placeholder="Сообщение..."><button class="c-snd" onclick="sndMsg()">➤</button></div><button class="sec-back" onclick="opForum()">НАЗАД</button></div>`;
    const{data}=await S.from('forum_messages').select('*').eq('topic_id',id).order('created_at',{ascending:!0});rnChat(data||[]);fade();
}
function rnChat(m){const c=G('c-msgs');c.innerHTML='';m.forEach(x=>{const d=document.createElement('div');d.className='c-msg';d.innerHTML=`<div class="c-usr">${x.user}</div><div class="c-txt">${x.text}</div><div class="c-tm">${x.time}</div>`;c.appendChild(d);});c.scrollTop=c.scrollHeight;}
async function sndMsg(){
    const tx=G('chat-in').value;if(!tx.trim())return;const n=new Date(),ts=n.toLocaleDateString()+' '+n.toLocaleTimeString().slice(0,5),usr=uProf.isAnon?'Аноним':uProf.login;
    await S.from('forum_messages').insert({topic_id:cTId,user:usr,text:tx,time:ts});G('chat-in').value='';opTop(cTId);
}
function play(id,t,img){hist=hist.filter(i=>String(i.id)!==String(id));hist.unshift({id,title:t,img});if(hist.length>20)hist.pop();LS.setItem('animeHistory',J.stringify(hist));G('plr').style.display='block';G('ifr').src=`https://pizdec.pro/id/${id}`;}
function clVid(){G('plr').style.display='none';G('ifr').src='';}
function cKey(){G('sInp').blur();}
function tgTopF(){const a=G('nt-area');a.style.display=a.style.display==='none'?'block':'none';}
function tgDel(){delMode=!delMode;G('adm-del').classList.toggle('del-act');rnTop();}
async function delTop(id){await S.from('forum_topics').delete().eq('id',id);fTops=fTops.filter(t=>t.id!==id);delMode=!1;G('adm-del').classList.remove('del-act');rnTop();}
async function crTop(){const t=G('nt-tit').value;if(!t.trim())return;await S.from('forum_topics').insert({title:t});opForum();}
let prg=0,lI=setInterval(()=>{
    prg+=1;if(prg>=100){clearInterval(lI);const s=G('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';const m=G('main');m.style.display='flex';setTimeout(()=>{m.style.opacity='1'},50)},400)}
    G('bar').style.width=prg+'%';G('perc').innerText=prg+'%';
},22);
</script>
</body>
</html>
