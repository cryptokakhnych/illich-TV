<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Search App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://sad.adsgram.ai/js/adsgram-ad-sdk.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}:root{--fh:100vh}
body,html{height:100%;width:100%;background:#000;color:#fff;overflow:hidden;position:fixed;-webkit-text-size-adjust:100%}
#bg-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:#000}
.bg-fix{width:100%;height:100%;background:url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/7E068F8D-434C-4D58-A6EB-587EF192B1E6%20(1).webp') center/100% 100% no-repeat;opacity:.6}

#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#000 url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/582912BF-C3C2-4689-B94E-BB11A3D639EF.webp') center/cover;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;transition:opacity .4s ease-out}
#load-c{margin-bottom:80px;display:flex;flex-direction:column;align-items:center}
.p-box{width:220px;height:22px;background:#00000099;border-radius:20px;overflow:hidden;border:1px solid #00d4ff66;position:relative;box-shadow:0 0 15px #00d4ff33}
#perc{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;z-index:5;color:#fff;font-weight:900;font-size:14px;text-shadow:1px 1px 2px #000;pointer-events:none}
#bar{height:100%;background:#00d4ff;width:0%;transition: width 0.1s linear;}

#main{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content: center; position:relative;opacity:0;transition:opacity .3s ease-in-out}
.glass{width:94%;height:80vh;background:#141414cc;border-radius:20px;border:1.5px solid #ffffff33;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px 0 #0000005e;position:relative;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}

.search-header {padding: 20px; display: flex; gap: 10px; border-bottom: 1px solid #ffffff1a;}
.search-header input {flex: 1; border: 1px solid #ffffff33; outline: 0; padding: 12px 20px; font-size: 16px; border-radius: 50px; color: #fff; background: #00000080; caret-color: #00d4ff;}
.btn-search {background: #00d4ff4d; color: #fff; border: 1px solid #00d4ff4d; padding: 0 25px; border-radius: 50px; font-weight: 700; cursor: pointer; transition: all .2s; backdrop-filter: blur(10px);}

#res{width:100%;padding:15px;overflow-y:auto;flex:1; scroll-behavior: smooth;}
.fade{animation:f .4s ease-out forwards}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="bg-container"><div class="bg-fix"></div></div>

<div id="splash">
    <div id="load-c">
        <div class="p-box"><div id="perc">0%</div><div id="bar"></div></div>
    </div>
</div>

<div id="main">
    <div class="glass">
        <div class="search-header">
            <input type="text" id="sInp" placeholder="Введите запрос...">
            <button class="btn-search" onclick="handleSearchWithAd()">ПОИСК</button>
        </div>
        <div id="res"></div>
    </div>
</div>

<script>
const G = i => document.getElementById(i);
let S = null;
let AdController = null;

// Инициализация библиотек
function initLibraries() {
    try {
        S = supabase.createClient('https://qklkjobkymwsevnzlrzj.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbGtqb2JreW13c2V2bnpscnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjE0OTksImV4cCI6MjA4NjUzNzQ5OX0.DYwygDJ-fvcDP1UUefWjbhcB3OTdAzR9gj-Qi30BYnA');
        
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: "int-22923" });
            console.log("Adsgram инициализирован");
        } else {
            console.error("Adsgram SDK не найден");
        }
    } catch (e) { console.error("Ошибка инициализации:", e); }
}

// Загрузочный экран
let prg = 0;
const lI = setInterval(() => {
    prg += 5; 
    G('bar').style.width = prg + '%';
    G('perc').innerText = prg + '%';
    if (prg >= 100) {
        clearInterval(lI);
        initLibraries();
        G('splash').style.opacity = '0';
        setTimeout(() => {
            G('splash').style.display = 'none';
            G('main').style.display = 'flex';
            setTimeout(() => G('main').style.opacity = '1', 50);
        }, 400);
    }
}, 50);

async function handleSearchWithAd() {
    const val = G('sInp').value.trim();
    if (!val) return;

    const resCont = G('res');
    resCont.innerHTML = '<p style="text-align:center; opacity:0.5;">Подготовка рекламы...</p>';

    if (AdController) {
        try {
            console.log("Запуск показа рекламы...");
            await AdController.show();
            console.log("Реклама просмотрена или закрыта");
        } catch (err) {
            // Если рекламы нет (no_ads) или ошибка — просто пишем в консоль и идем дальше
            console.warn("Реклама не была показана:", err.error || err);
        }
    } else {
        console.warn("Контроллер рекламы не готов");
    }
    
    // Поиск запускается в любом случае после попытки показа рекламы
    performSearch(val);
}

async function performSearch(val) {
    if (!S) {
        G('res').innerHTML = '<p style="text-align:center; color:red;">Ошибка базы данных</p>';
        return;
    }
    G('res').innerHTML = '<p style="text-align:center; opacity:0.5;">Ищем в базе...</p>';
    
    try {
        const { data, error } = await S.from('profiles').select('*').ilike('login', `%${val}%`);
        G('res').innerHTML = '';
        G('res').classList.add('fade');

        if (error) throw error;
        if (data && data.length > 0) {
            data.forEach(item => {
                const div = document.createElement('div');
                div.style.cssText = 'padding:12px; margin-bottom:8px; background:#ffffff10; border-radius:10px; border:1px solid #ffffff1a;';
                div.innerText = item.login || 'User';
                G('res').appendChild(div);
            });
        } else {
            G('res').innerHTML = '<p style="text-align:center; opacity:0.5;">Ничего не найдено</p>';
        }
    } catch (err) {
        G('res').innerHTML = '<p style="text-align:center; color:red;">Ошибка запроса</p>';
    }
}

// Отключаем Enter
G('sInp').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
</script>
</body>
</html>
