<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Illich TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background: #000; 
            color: white; 
            overflow: hidden;
            position: fixed;
            -webkit-text-size-adjust: 100%;
        }
        
        /* ФОН ПРИЛОЖЕНИЯ */
        #bg-container { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            background: #000;
        }

        .background-fixed {
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/7E068F8D-434C-4D58-A6EB-587EF192B1E6%20(1).webp');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: 100% 100%; 
            opacity: 0.6;
        }

        /* ЗАГРУЗОЧНЫЙ ЭКРАН */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/582912BF-C3C2-4689-B94E-BB11A3D639EF.webp') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-container {
            margin-top: -60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #perc {
            color: #00d4ff; 
            font-weight: 900; 
            margin-bottom: 2px;
            font-size: 18px;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
        }

        .progress-box {
            width: 200px; 
            height: 6px; 
            background: rgba(0,0,0,0.5); 
            border-radius: 10px; 
            overflow: hidden;
            border: 1px solid rgba(0,212,255,0.3);
        }

        /* КОНТЕНТ */
        #main-content { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 15px; 
            position: relative; 
        }
        
        .top-bar { 
            width: 94%; 
            display: flex; 
            gap: 10px;
            align-items: center; 
            z-index: 100; 
            margin-bottom: 15px;
        }

        .search-box { 
            flex: 1;
            display: flex; 
            background: #fff; 
            border-radius: 50px; 
            padding: 3px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .search-box input { 
            flex: 1; border: none; outline: none; padding: 8px 15px; 
            font-size: 14px; border-radius: 50px; color: #000; 
        }

        .search-btn { 
            background: #00d4ff; color: #fff; border: none; padding: 0 15px; 
            border-radius: 50px; font-weight: bold; font-size: 12px;
            cursor: pointer;
        }

        .menu-btn {
            width: 40px; height: 40px; background: rgba(0,0,0,0.7);
            border: 1px solid #00d4ff33; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 4px;
        }
        .menu-btn span { width: 20px; height: 2px; background: #00d4ff; border-radius: 2px; }

        /* ПРОСТО ОБВОДКА БЕЗ БЛЮРА И ФОНА */
        .glass-container {
            flex: 1;
            width: 94%;
            margin-bottom: 20px;
            background: transparent; /* Полностью прозрачный фон */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2); /* Только обводка */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #results { 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            padding: 15px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        .card { 
            background: rgba(0,0,0,0.4); 
            border-radius: 12px; 
            padding: 8px; 
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: center; 
        }
        .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; }
        .card div { font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ПЛЕЕР */
        #player-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 2000; }
        #player-iframe { width: 100%; height: 100%; border: none; }
        .close-btn { 
            position: absolute; top: 40px; right: 20px; background: rgba(255,255,255,0.2); 
            color: #fff; border: none; padding: 10px 20px; border-radius: 30px; 
            font-weight: bold; backdrop-filter: blur(10px); z-index: 2100; 
        }
    </style>
</head>
<body onclick="closeKeyboard(event)">

    <div id="bg-container">
        <div class="background-fixed"></div>
    </div>

    <div id="splash-screen">
        <div id="loading-container">
            <div id="perc">0%</div>
            <div class="progress-box">
                <div id="bar" style="width: 0%; height: 100%; background: #00d4ff; transition: width 0.1s linear;"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="search-box" onclick="event.stopPropagation()">
                <input type="text" id="sInp" placeholder="Название аниме..." onkeypress="if(event.key === 'Enter') { search(); closeKeyboard(event); }">
                <button class="search-btn" onclick="search(); closeKeyboard(event);">ПОИСК</button>
            </div>
            <div class="menu-btn">
                <span></span><span></span><span></span>
            </div>
        </div>
        
        <div class="glass-container">
            <div id="results"></div>
        </div>
    </div>

    <div id="player-layer">
        <button class="close-btn" onclick="closeVideo()">✕ ЗАКРЫТЬ</button>
        <iframe id="player-iframe" allowfullscreen></iframe>
    </div>

    <script>
        const initialHeight = window.innerHeight;

        function fixBackground() {
            const bgContainer = document.getElementById('bg-container');
            const bgFixed = document.querySelector('.background-fixed');
            bgContainer.style.height = initialHeight + 'px';
            bgFixed.style.height = initialHeight + 'px';
        }

        window.addEventListener('load', fixBackground);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                const h = window.innerHeight;
                document.getElementById('bg-container').style.height = h + 'px';
                document.querySelector('.background-fixed').style.height = h + 'px';
            }, 200);
        });

        function closeKeyboard(e) {
            const input = document.getElementById('sInp');
            if (document.activeElement === input) {
                input.blur();
                window.scrollTo(0, 0);
            }
        }

        // ЗАГРУЗКА 2.1 сек
        let progress = 0;
        const duration = 2100; 
        const intervalTime = 20;
        const step = 100 / (duration / intervalTime);

        let loadingInterval = setInterval(() => {
            progress += step;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                setTimeout(() => {
                    const ss = document.getElementById('splash-screen');
                    ss.style.opacity = '0';
                    setTimeout(() => {
                        ss.style.display = 'none';
                        document.getElementById('main-content').style.display = 'flex';
                    }, 500);
                }, 200);
            }
            const displayValue = Math.round(progress);
            document.getElementById('bar').style.width = displayValue + '%';
            document.getElementById('perc').innerText = displayValue + '%';
        }, intervalTime);

        async function search() {
            const q = document.getElementById('sInp').value;
            if(!q) return;
            document.getElementById('results').innerHTML = '<p style="padding:20px; text-align:center;">Ищем...</p>';
            try {
                const r = await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(q)}&limit=20`);
                const data = await r.json();
                document.getElementById('results').innerHTML = '';
                if(data.length === 0) {
                    document.getElementById('results').innerHTML = '<p style="padding:20px; text-align:center;">Ничего не найдено</p>';
                    return;
                }
                data.forEach(a => {
                    const d = document.createElement('div');
                    d.className = 'card';
                    d.innerHTML = `<img src="https://shikimori.one${a.image.preview}"><div>${a.russian || a.name}</div>`;
                    d.onclick = (e) => { e.stopPropagation(); play(a.id); };
                    document.getElementById('results').appendChild(d);
                });
            } catch(e) { 
                document.getElementById('results').innerHTML = '<p style="padding:20px; text-align:center;">Ошибка сети</p>';
            }
        }

        function play(id) {
            const layer = document.getElementById('player-layer');
            const iframe = document.getElementById('player-iframe');
            layer.style.display = 'block';
            iframe.src = `https://pizdec.pro/id/${id}`;
        }

        function closeVideo() {
            document.getElementById('player-layer').style.display = 'none';
            document.getElementById('player-iframe').src = '';
        }
    </script>
</body>
</html>
