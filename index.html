function txt(k){return LANG.ru[k];}

async function ldProf(mail){

}
function fade(){const r=G('res');r.classList.remove('fade');void r.offsetWidth;r.classList.add('fade');}
function tgMenu(){const m=G('menu-ov');m.style.display=(m.style.display==='block')?'none':'block';}
function hideMenu(){G('menu-ov').style.display='none';}
function opAuth(m){G('g-menu').style.display='none';G('a-frm').style.display='flex';G('a-sub').innerText=m==='login'?LANG.ru.btn_ent:LANG.ru.btn_crt;G('a-tit').innerText=m==='login'?LANG.ru.login_tit:LANG.ru.reg_tit;}
function rstMenu(){G('a-frm').style.display='none';if(LS.getItem('illich_is_logged_in')==='true')G('u-menu').style.display='block';else{G('g-menu').style.display='block';G('u-menu').style.display='none';}}
async function pAuth(){

function logout(){LS.removeItem('illich_is_logged_in');LS.removeItem('user_email');G('u-menu').style.display='none';G('g-menu').style.display='block';G('a-frm').style.display='none';goHome();}
function hTyp(v){
    clearTimeout(sTm);const b=G('m-back');
    if(v.trim().length>0){b.style.display='block';isS=!0;cMode='search';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('c-lbl').innerText=txt('lbl_res');sTm=setTimeout(()=>search(),300);}

function swTab(t){
    G('t-rec').classList.toggle('active',t==='recommendations');G('t-new').classList.toggle('active',t==='new');G('t-hst').classList.toggle('active',t==='history');
    if(t==='recommendations')rPg=1;if(t==='new')nPg=1;loadHome(t);
}
function goHome(){
    G('m-back').style.display='none';G('glass').style.height='calc(var(--fh) - 185px)';G('glass').style.overflow='hidden';G('t-bar').style.display='flex';G('gl-back').style.display='none';G('h-tabs').style.display='flex';G('c-head').style.display='none';
    if(cMode==='topic'){opForum();return;}

async function AL(q, v) {
    const r = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query: q, variables: v })
    });
    return await r.json();
}

async function loadHome(t,app=0){
    if(ldAll && !app) return;
    const res=G('res'),lbl=G('c-lbl');
    const thisMode = t;
    cMode=t;
    if(t==='history'){lbl.innerText=txt('lbl_hst');res.innerHTML='';if(!hist.length)res.innerHTML=`<p style="text-align:center;padding:40px;opacity:.3;font-size:12px">${txt('empty_hst')}</p>`;else hist.forEach(a=>res.appendChild(mkCard(a)));fade();return;}
    lbl.innerText=t==='recommendations'?txt('lbl_rec'):txt('lbl_new');
    if(!app)res.innerHTML=`<p style="text-align:center;padding:20px">${txt('load')}</p>`;
    
    ldAll=true;
    let p=t==='recommendations'?rPg:nPg;
    let s=t==='recommendations'?'POPULARITY_DESC':'TRENDING_DESC';
    let filter = '';
    if (t==='new') { s='START_DATE_DESC'; filter = ', episodes_greater: 0, status_in: [RELEASING, FINISHED]'; }

    const Q = `query ($p: Int, $s: [MediaSort]) { Page(page: $p, perPage: 20) { media(sort: $s, type: ANIME ${filter}) { id idMal title { romaji english } coverImage { large } } } }`;
    
    try{
        const d = await AL(Q, {p:p, s:s});
        const list = d.data.Page.media;
        if(cMode !== thisMode) { ldAll=false; return; }
        if(!app)res.innerHTML='';
        for(const a of list){
            if(cMode !== thisMode) break;
            let tit = a.title.romaji || a.title.english;
            if(a.idMal){
                try{
                    const sR=await fetch(`https://shikimori.one/api/animes/${a.idMal}`);
                    if(sR.ok){const sD=await sR.json(); if(sD.russian) tit=sD.russian;}
                }catch(e){}
            }
            if(cMode === thisMode) res.appendChild(mkCard({id:a.id,title:tit,img:a.coverImage.large}))
        }
        if(t==='recommendations')rPg++;else nPg++;if(!app)fade();
    }catch(e){if(!app)res.innerHTML=`<p style="text-align:center;padding:20px">${txt('net_err')}</p>`;}
    ldAll=false;
}

function mkCard(a){
    const d=document.createElement('div'),favd=fav.some(f=>String(f.id)===String(a.id));
    d.className='card';
    d.innerHTML=`<img src="${imgP(a.img, 150)}" onclick="opInfo('${a.id}')" onerror="this.src='https://via.placeholder.com/50x70?text=?'"><div onclick="opInfo('${a.id}')">${a.title}</div><button class="fav-btn ${favd?'fav-act':''}" onclick="tgFav(event,'${a.id}','${a.title.replace(/'/g,"\\'")}','${a.img}')">${favd?'❤️':'🤍'}</button>`;
    return d;
}

async function opInfo(id) {
    const thisMode = 'info';
    cMode = 'info';
    const res = G('res');
    res.innerHTML = `<p style="text-align:center;padding:20px">${txt('load')}</p>`;
    G('glass').style.height='calc(var(--fh) - 120px)';
    G('t-bar').style.display='none';
    G('h-tabs').style.display='none';
    G('c-head').style.display='flex';
    G('gl-back').style.display='block';
    G('c-lbl').innerText="Инфо";
    
    const Q = `query ($id: Int) { Media(id: $id) { id idMal title { romaji english } coverImage { extraLarge } bannerImage description averageScore episodes startDate { year } } }`;

    try {
        const d = await AL(Q, {id:id});
        const a = d.data.Media;
        if(cMode !== thisMode) return;
        
        let finalTitle = a.title.romaji || a.title.english;
        let finalDesc = a.description || "Нет описания.";
        let screenshots = [];

        if (a.idMal) {
            try {
                const sR = await fetch(`https://shikimori.one/api/animes/${a.idMal}`);
                if (sR.ok) {
                    const sD = await sR.json();
                    if (sD.russian) finalTitle = sD.russian;
                    if (sD.description_html) finalDesc = sD.description_html;
                    const scrR = await fetch(`https://shikimori.one/api/animes/${a.idMal}/screenshots`);
                    if(scrR.ok) screenshots = await scrR.json();
                }
            } catch (err) {}
        }

        hist=hist.filter(i=>String(i.id)!==String(id));
        hist.unshift({id, title: finalTitle, img: a.coverImage.extraLarge});
        if(hist.length>20)hist.pop();LS.setItem('animeHistory',J.stringify(hist));

        let galleryHtml = '';
        let photoUrls = [];
        if(screenshots.length > 0){
            photoUrls = screenshots.map(s => `https://shikimori.one${s.original}`);
            galleryHtml = '<div class="info-gallery">';
            photoUrls.forEach(u => {
                galleryHtml += `<img src="${imgP(u, 300)}" onclick="opImg('${u}', ${JSON.stringify(photoUrls)})">`;
            });
            galleryHtml += '</div>';
        }

        const bnr = a.bannerImage || a.coverImage.extraLarge;
        res.innerHTML = `
            <div style="padding:10px; display:flex; flex-direction:column; gap:10px;">
                <img src="${imgP(bnr)}" class="info-img" onclick="opImg('${bnr}')" onerror="this.src='https://via.placeholder.com/400x200?text=Photo'">
                ${galleryHtml}
                <h2 style="color:#00d4ff; text-align:center;">${finalTitle}</h2>
                <div style="display:flex; justify-content:space-around; font-size:12px; color:#00d4ff; font-weight:700; margin-bottom:10px;">
                    <span>⭐ ${a.averageScore || '?'}</span><span>🎬 ${a.episodes || '?'} эп.</span><span>📅 ${a.startDate.year || '?'}</span>
                </div>
                <div class="info-desc">${finalDesc}</div>
                <div class="mini-player">
                    <iframe src="https://pizdec.pro/id/${id}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
                </div>
                <div style="height:40px"></div>
            </div>
        `;
        res.scrollTop = 0;
        fade();
    } catch(e) { res.innerHTML = `<p style="text-align:center;padding:20px">${txt('err')}</p>`; }
}

async function search(q=null){
    const thisMode = 'search';
    cMode = 'search';
    const v=q||G('sInp').value;if(!v&&!q)return;const res=G('res');
    res.innerHTML=`<p style="text-align:center;padding:20px">${txt('load')}</p>`;
    const Q = `query ($s: String) { Page(page: 1, perPage: 20) { media(search: $s, type: ANIME) { id idMal title { romaji english } coverImage { large } } } }`;
    try{
        const d = await AL(Q, {s:v});
        const list = d.data.Page.media;
        if(cMode !== thisMode) return;
        res.innerHTML='';
        if(!list.length){res.innerHTML=`<p style="text-align:center;padding:20px">${txt('not_found')}</p>`;return;}
        for(const a of list){
             if(cMode !== thisMode) break;
             let tit = a.title.romaji || a.title.english;
             if(a.idMal){
                try{
                    const sR=await fetch(`https://shikimori.one/api/animes/${a.idMal}`);
                    if(sR.ok){const sD=await sR.json(); if(sD.russian) tit=sD.russian;}
                }catch(e){}
             }
             res.appendChild(mkCard({id:a.id,title:tit,img:a.coverImage.large}))
        }
        fade();
    }catch(e){res.innerHTML=`<p style="text-align:center;padding:20px">${txt('err')}</p>`;}
}

function isAu(){if(LS.getItem('illich_is_logged_in')!=='true'){alert("Раздел доступен только авторизованным пользователям.");return 0;}return 1;}
function opAll(){
    if(!isAu())return;hideMenu();cMode='all-anime';aPg=1;G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText=txt('lbl_all');G('res').innerHTML=`<p style="text-align:center;padding:20px">${txt('load')}</p>`;ldAllAn();fade();
}
async function ldAllAn(app=0){
    if(ldAll && !app)return;
    const thisMode = 'all-anime';
    ldAll=!0;
    const Q = `query ($p: Int) { Page(page: $p, perPage: 50) { media(sort: POPULARITY_DESC, type: ANIME) { id idMal title { romaji english } coverImage { large } } } }`;
    try{
        const d = await AL(Q, {p:aPg});
        const list = d.data.Page.media;
        if(cMode !== thisMode) { ldAll=false; return; }
        const res=G('res');
        if(!app)res.innerHTML='';
        if(list.length){
            for(const a of list){
                if(cMode !== thisMode) break;
                let tit = a.title.romaji || a.title.english;
                if(a.idMal){
                    try {
                        const sR=await fetch(`https://shikimori.one/api/animes/${a.idMal}`);
                        if(sR.ok){const sD=await sR.json(); if(sD.russian) tit=sD.russian;}
                    } catch(e){}
                }
                res.appendChild(mkCard({id:a.id,title:tit,img:a.coverImage.large}));
            }
            aPg++;
        }
    }catch(e){}ldAll=!1;
}

function opFav(){
    if(!isAu())return;hideMenu();cMode='favorites';G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText=txt('lbl_fav');renFav();fade();
}
function renFav(){const r=G('res');r.innerHTML='';if(!fav.length){r.innerHTML=`<p style="text-align:center;padding:40px;opacity:.3;font-size:12px">${txt('empty_hst')}</p>`;return;}fav.forEach(a=>r.appendChild(mkCard(a)));}
function tgFav(e,id,tit,img){e.stopPropagation();const i=fav.findIndex(f=>String(f.id)===String(id));if(i>-1){fav.splice(i,1);e.target.innerText='🤍';e.target.classList.remove('fav-act');if(cMode==='favorites')renFav();}else{fav.unshift({id,title:tit,img});e.target.innerText='❤️';e.target.classList.add('fav-act');}LS.setItem('animeFavorites',J.stringify(fav));}

function opProf(){
    if(!isAu())return;hideMenu();cMode='profile';G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText=txt('lbl_prof');
    const r=G('res'),an=uProf.isAnon?'Аноним':'Не аноним',ac=uProf.isAnon?'anon-act':'';
    r.innerHTML=`<div class="p-view"><div class="p-row"><span class="p-lbl">${txt('prof_log')}</span><input type="text" id="e-log" class="p-inp" value="${uProf.login}"></div><div class="p-row"><span class="p-lbl">Email</span><input type="email" id="e-em" class="p-inp" value="${uProf.email}"></div><div class="p-row"><span class="p-lbl">${txt('prof_dob')}</span><input type="text" id="e-dob" class="p-inp" value="${uProf.dob}"></div><div class="p-row"><span class="p-lbl">${txt('prof_nat')}</span><input type="text" id="e-nat" class="p-inp" value="${uProf.nat}"></div><div class="p-row"><span class="p-lbl">${txt('prof_ps')}</span><input type="password" id="e-ps" class="p-inp" value="${uProf.password}"></div><div class="p-row"><span class="p-lbl">${txt('prof_mod')}</span><button class="anon-btn ${ac}" onclick="tgAnon()">${an}</button></div><button id="sv-p-btn" class="sv-btn" onclick="svProf()">${txt('prof_sv')}</button><div style="height:100px"></div></div>`;fade();
}
async function svProf(){
    uProf.login=G('e-log').value;uProf.email=G('e-em').value;uProf.dob=G('e-dob').value;uProf.nat=G('e-nat').value;uProf.password=G('e-ps').value;
    await S.from('profiles').upsert({id:uProf.email,login:uProf.login,email:uProf.email,password:uProf.password,dob:uProf.dob,nat:uProf.nat,is_anon:uProf.isAnon});
    alert("Профиль сохранен");
}
async function tgAnon(){uProf.isAnon=!uProf.isAnon;await S.from('profiles').upsert({id:uProf.email,is_anon:uProf.isAnon});opProf();}
async function opForum(){
    if(!isAu())return;hideMenu();cMode='forum';delMode=!1;G('glass').style.height='calc(var(--fh) - 120px)';G('t-bar').style.display='none';G('h-tabs').style.display='none';G('c-head').style.display='flex';G('gl-back').style.display='none';G('c-lbl').innerText=txt('lbl_forum');
    const r=G('res'),adm=(uProf.login===ADMIN);
    r.innerHTML=`<div class="f-head"><div class="f-tool"><input type="text" id="f-s-inp" class="f-inp" placeholder="${txt('f_s_ph')}"><div class="f-grp"><div class="btn" style="padding:0 10px;display:flex;align-items:center" onclick="fltTop(G('f-s-inp').value)">${txt('f_s_btn')}</div><div class="f-add" onclick="tgTopF()">+</div><div class="f-del" id="adm-del" style="display:${adm?'flex':'none'}" onclick="tgDel()">-</div></div></div></div><div id="nt-area" style="display:none"><div class="nt-form"><input type="text" id="nt-tit" class="new-top-inp" placeholder="${txt('f_nt_ph')}"><button class="nt-btn" onclick="crTop()">${txt('f_nt_btn')}</button></div></div><div id="t-list" style="padding:10px"></div>`;
    const{data}=await S.from('forum_topics').select('*').order('created_at',{ascending:!1});fTops=data||[];rnTop();fade();
}
function rnTop(f=''){
    const l=G('t-list');l.innerHTML='';const fd=fTops.filter(t=>t.title.toLowerCase().includes(f.toLowerCase()));
    fd.forEach(t=>{const d=document.createElement('div');d.className='t-card';d.innerHTML=`<span class="t-tit">${t.title}</span>`+(delMode?`<button class="t-del" onclick="delTop(${t.id})">🗑️</button>`:`<button class="t-sel" onclick="opTop(${t.id})">Выбрать</button>`);l.appendChild(d);});
}
async function opTop(id){
    cMode='topic';cTId=id;G('glass').style.height='calc(var(--fh) - 120px)';
    const t=fTops.find(x=>x.id===id);G('c-lbl').innerText=t.title;
    G('res').innerHTML=`<div class="chat-wrp"><div class="chat-c" id="c-msgs"></div><div class="c-fix"><input type="text" id="chat-in" class="chat-inp" placeholder="${txt('msg_ph')}"><button class="c-snd" onclick="sndMsg()">➤</button></div><button class="sec-back" onclick="opForum()">${txt('back')}</button></div>`;
    const{data}=await S.from('forum_messages').select('*').eq('topic_id',id).order('created_at',{ascending:!0});rnChat(data||[]);fade();
}
function rnChat(m){const c=G('c-msgs');c.innerHTML='';m.forEach(x=>{const d=document.createElement('div');d.className='c-msg';d.innerHTML=`<div class="c-usr">${x.user}</div><div class="c-txt">${x.text}</div><div class="c-tm">${x.time}</div>`;c.appendChild(d);});c.scrollTop=c.scrollHeight;}
async function sndMsg(){
    const tx=G('chat-in').value;if(!tx.trim())return;const n=new Date(),ts=n.toLocaleDateString()+' '+n.toLocaleTimeString().slice(0,5),usr=uProf.isAnon?'Аноним':uProf.login;
    await S.from('forum_messages').insert({topic_id:cTId,user:usr,text:tx,time:ts});G('chat-in').value='';opTop(cTId);
}
function clVid(){G('plr').style.display='none';G('ifr').src='';}
function cKey(){G('sInp').blur();}
function tgTopF(){const a=G('nt-area');a.style.display=a.style.display==='none'?'block':'none';}
function tgDel(){delMode=!delMode;G('adm-del').classList.toggle('del-act');rnTop();}
async function delTop(id){await S.from('forum_topics').delete().eq('id',id);fTops=fTops.filter(t=>t.id!==id);delMode=!1;G('adm-del').classList.remove('del-act');rnTop();}
async function crTop(){const t=G('nt-tit').value;if(!t.trim())return;await S.from('forum_topics').insert({title:t});opForum();}
let prg=0,lI=setInterval(()=>{
    prg+=1;if(prg>=100){clearInterval(lI);const s=G('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none';const m=G('main');m.style.display='flex';setTimeout(()=>{m.style.opacity='1'},50)},400)}
    G('bar').style.width=prg+'%';G('perc').innerText=prg+'%';
},22);
</script>
