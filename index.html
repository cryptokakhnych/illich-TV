<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illich TV</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { height: 100%; overflow: hidden; background: #000; color: white; }

        /* ЭКРАН ЗАГРУЗКИ */
        #splash-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/675D03F8-DE2B-4844-9B3F-011C5811F4EA.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        /* ЕДИНЫЙ БЛОК ЗАГРУЗКИ */
        .loader-wrapper {
            width: 60%;
            max-width: 300px;
            margin-bottom: 120px; /* Над телевизором */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #loader-number {
            font-size: 18px; /* Уменьшил размер */
            font-weight: 600;
            color: #00d4ff;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
            letter-spacing: 1px;
        }

        .loader-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ffffff);
            box-shadow: 0 0 15px #00d4ff;
            transition: width 2.5s linear;
        }

        /* ГЛАВНЫЙ ЭКРАН */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/B27771DC-EBA0-4BCB-8EE0-CC0E6B370598.png') no-repeat center center;
            background-size: cover;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 15vh;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .search-group {
            width: 90%;
            max-width: 600px;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .search-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 25px;
            font-size: 18px;
            background: transparent;
            color: #222;
        }

        .search-btn {
            background: #00d4ff;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="loader-wrapper">
            <div id="loader-number">0%</div>
            <div class="loader-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Найти аниме...">
            <button class="search-btn" onclick="executeSearch()">ПОИСК</button>
        </div>
    </div>

    <script>
        function init() {
            const bar = document.getElementById('progress-bar');
            const num = document.getElementById('loader-number');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            let progress = 0;
            const startTime = Date.now();
            const duration = 2500;

            // Синхронный запуск шкалы и чисел
            bar.style.width = '100%';

            const timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = Math.min((elapsed / duration) * 100, 100);
                
                num.innerText = Math.floor(progress) + '%';

                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            main.style.display = 'flex';
                            setTimeout(() => main.style.opacity = '1', 50);
                        }, 800);
                    }, 300);
                }
            }, 30);
        }

        window.onload = init;

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            if (query) alert('Поиск: ' + query);
        }
    </script>
</body>
</html>
