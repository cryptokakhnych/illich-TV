<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>illich TV - Stable</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body, html { height: 100%; background: #000; color: #fff; overflow: hidden; }
        
        /* Загрузочный экран */
        #loader-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        .progress-container { width: 70%; height: 4px; background: #222; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #00d4ff; transition: width 0.4s; }
        #loader-status { font-size: 12px; margin-top: 10px; color: #666; text-transform: uppercase; }

        /* Основной контент */
        #app { display: none; padding: 20px; flex-direction: column; align-items: center; height: 100vh; }
        .search-box { 
            width: 100%; max-width: 400px; background: #1a1a1a; 
            padding: 15px; border-radius: 20px; border: 1px solid #333;
            display: flex; gap: 10px; margin-top: 20px;
        }
        input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; }
        button { background: #00d4ff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Таблица результатов */
        .res-table { width: 100%; max-width: 400px; margin-top: 20px; border-collapse: collapse; font-size: 14px; }
        .res-table th { color: #00d4ff; text-align: left; padding: 10px; border-bottom: 1px solid #333; font-size: 12px; }
        .res-table td { padding: 12px 10px; border-bottom: 1px solid #111; }
        .err-msg { color: #ff4b4b; background: rgba(255,75,75,0.1); padding: 10px; border-radius: 10px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div id="loader-screen">
        <h1 style="letter-spacing: 2px;">illich TV</h1>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="loader-status">Подключение к сети...</p>
    </div>

    <div id="app">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по логину...">
            <button onclick="startAction()">ПОИСК</button>
        </div>
        <div id="resultArea" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <script>
        const supabaseUrl = 'https://qklkjobkymwsevnzlrzj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbGtqb2JreW13c2V2bnpscnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjE0OTksImV4cCI6MjA4NjUzNzQ5OX0.DYwygDJ-fvcDP1UUefWjbhcB3OTdAzR9gj-Qi30BYnA';
        const sb = supabase.createClient(supabaseUrl, supabaseKey);

        let adController = null;

        // --- ЛОГИКА ЗАГРУЗКИ SDK ---
        function initSDK() {
            const bar = document.getElementById('progress-bar');
            const status = document.getElementById('loader-status');
            
            // Шаг 1: Имитируем начало
            bar.style.width = '30%';
            
            const script = document.createElement('script');
            script.src = "https://sad.adsgram.ai/js/adsgram-ad-sdk.js";
            script.async = true;

            script.onload = () => {
                bar.style.width = '100%';
                status.innerText = 'Готово';
                // Инициализируем контроллер сразу после загрузки
                if (window.Adsgram) {
                    adController = window.Adsgram.init({ blockId: "int-22923" });
                }
                setTimeout(showApp, 500);
            };

            script.onerror = () => {
                bar.style.background = '#ff4b4b';
                status.innerText = 'Ошибка загрузки SDK';
                status.style.color = '#ff4b4b';
                setTimeout(showApp, 1500); // Всё равно пускаем в приложение
            };

            document.head.appendChild(script);
        }

        function showApp() {
            document.getElementById('loader-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
        }

        // --- ЛОГИКА ПОИСКА И РЕКЛАМЫ ---
        function startAction() {
            const val = document.getElementById('searchInput').value.trim();
            const res = document.getElementById('resultArea');
            
            if (!val) return;

            res.innerHTML = '<p style="margin-top:20px; color:#666;">Запуск проверки...</p>';

            if (adController) {
                // ИСПОЛЬЗУЕМ СИНТАКСИС ИЗ ТВОЕЙ ДОКУМЕНТАЦИИ (Скриншот 6)
                adController.show().then((result) => {
                    // Реклама либо просмотрена, либо закрыта — в любом случае даем результат
                    searchData(val);
                }).catch((err) => {
                    res.innerHTML = `<div class="err-msg">Реклама не загрузилась (${err.error || 'Сбой'})</div>`;
                    searchData(val); // Всё равно ищем
                });
            } else {
                res.innerHTML = `<div class="err-msg">SDK отсутствует. Проверьте соединение.</div>`;
                searchData(val);
            }
        }

        async function searchData(login) {
            const res = document.getElementById('resultArea');
            try {
                const { data, error } = await sb.from('profiles').select('*').ilike('login', `%${login}%`);
                
                if (data && data.length > 0) {
                    let table = `<table class="res-table"><tr><th>ЛОГИН</th><th>ID</th></tr>`;
                    data.forEach(item => {
                        table += `<tr><td>${item.login}</td><td style="color:#666; font-size:10px;">${item.id}</td></tr>`;
                    });
                    table += `</table>`;
                    res.innerHTML = table;
                } else {
                    res.innerHTML = '<p style="margin-top:20px;">Ничего не найдено</p>';
                }
            } catch (e) {
                res.innerHTML = '<p style="color:red;">Ошибка базы данных</p>';
            }
        }

        // Запуск системы
        initSDK();
    </script>
</body>
</html>
