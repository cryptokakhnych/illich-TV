<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illich TV</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { height: 100%; overflow: hidden; background: #000; color: white; }

        /* ЭКРАН ЗАГРУЗКИ */
        #splash-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/675D03F8-DE2B-4844-9B3F-011C5811F4EA.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        /* ЕДИНЫЙ БЛОК ЗАГРУЗКИ */
        .loader-wrapper {
            width: 60%;
            max-width: 300px;
            margin-bottom: 120px; /* Позиция над телевизором */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px; /* Максимально близко к шкале */
        }

        #loader-number {
            font-size: 18px;
            font-weight: 800;
            color: #00d4ff;
            /* Легкая темная обводка для четкости */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0 0 10px rgba(0, 212, 255, 0.8);
            letter-spacing: 1px;
            z-index: 2;
        }

        .loader-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ffffff);
            box-shadow: 0 0 20px #00d4ff;
            transition: width 2.5s linear;
        }

        /* ГЛАВНЫЙ ЭКРАН */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/B27771DC-EBA0-4BCB-8EE0-CC0E6B370598.png') no-repeat center center;
            background-size: cover;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 15vh;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .search-group {
            width: 90%;
            max-width: 600px;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .search-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 25px;
            font-size: 18px;
            background: transparent;
            color: #222;
        }

        .search-btn {
            background: #00d4ff;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:active { transform: scale(0.98); }

        /* КОНТЕЙНЕР РЕЗУЛЬТАТОВ */
        #results-container {
            width: 95%;
            max-width: 800px;
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            overflow-y: auto;
            max-height: 70vh;
            padding: 10px;
            scrollbar-width: none; /* Скрываем скролл для красоты */
        }
        #results-container::-webkit-scrollbar { display: none; }

        .anime-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            transition: transform 0.2s, border 0.2s;
            cursor: pointer;
        }
        .anime-card:hover { 
            transform: translateY(-5px);
            border: 1px solid #00d4ff;
        }
        .anime-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .anime-card div {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
            height: 32px;
            overflow: hidden;
        }

    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="loader-wrapper">
            <div id="loader-number">0%</div>
            <div class="loader-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Найти аниме...">
            <button class="search-btn" onclick="executeSearch()">ПОИСК</button>
        </div>
        <div id="results-container"></div>
    </div>

    <script>
        function init() {
            const bar = document.getElementById('progress-bar');
            const num = document.getElementById('loader-number');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            const duration = 2500;
            const startTime = Date.now();

            bar.style.width = '100%';

            const timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / duration) * 100, 100);
                
                num.innerText = Math.floor(progress) + '%';

                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            main.style.display = 'flex';
                            setTimeout(() => main.style.opacity = '1', 50);
                        }, 800);
                    }, 300);
                }
            }, 16);
        }

        window.onload = init;

        // ФУНКЦИЯ ПОИСКА ЧЕРЕЗ SHIKIMORI API
        async function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const container = document.getElementById('results-container');
            
            if (!query) return;

            container.innerHTML = '<p style="text-align:center; width:100%; text-shadow: 0 0 10px #00d4ff;">Ищем в базе Shikimori...</p>';

            try {
                // Запрос к API Shikimori (лимит 12 для сетки)
                const response = await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(query)}&limit=12&order=popularity`);
                const data = await response.json();

                container.innerHTML = ''; 

                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">Ничего не найдено :(</p>';
                    return;
                }

                data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    // Формируем ссылку на постер (у Шикимори относительные пути)
                    const posterUrl = `https://shikimori.one${anime.image.preview}`;

                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${anime.russian || anime.name}">
                        <div>${anime.russian || anime.name}</div>
                    `;

                    // При клике - переход к выбору озвучки (пока алертом)
                    card.onclick = () => {
                        alert(`Вы выбрали: ${anime.russian || anime.name}\nShikimori ID: ${anime.id}\nДалее мы подтянем озвучки через ShikiVideo!`);
                    };
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Ошибка API:', error);
                container.innerHTML = '<p style="text-align:center; width:100%; color:red;">Ошибка подключения к базе</p>';
            }
        }
        
        // Поиск по нажатию Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
