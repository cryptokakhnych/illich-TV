<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illich TV | Loading...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body, html { height: 100%; overflow: hidden; background: #000; color: white; }

        /* ЭКРАН ЗАГРУЗКИ (SPLASH) */
        #splash-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/675D03F8-DE2B-4844-9B3F-011C5811F4EA.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Центрируем контент */
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        /* Контейнер для шкалы и цифр (размещаем над центром/телевизором) */
        .loader-wrapper {
            width: 70%;
            max-width: 400px;
            margin-bottom: 50px; /* Смещение вверх, чтобы быть над "телевизором" */
            text-align: center;
        }

        #loader-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .loader-container {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffffff, #888);
            box-shadow: 0 0 15px #fff;
            transition: width 2.5s linear;
        }

        /* ГЛАВНЫЙ ЭКРАН ПОСЛЕ ЗАГРУЗКИ */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/B27771DC-EBA0-4BCB-8EE0-CC0E6B370598.png') no-repeat center center;
            background-size: cover;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* Поле поиска в стиле Google */
        .search-container {
            width: 90%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            background: #fff;
            display: flex;
            padding: 5px 15px;
            border-radius: 30px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .search-bar input {
            width: 100%;
            height: 45px;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 0 10px;
            color: #333;
        }

        .search-buttons {
            margin-top: 25px;
        }

        .btn-google {
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            backdrop-filter: blur(5px);
        }

        .btn-google:hover {
            border: 1px solid #ccc;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="loader-wrapper">
            <div id="loader-number">0%</div>
            <div class="loader-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск в Illich TV или введите URL">
            </div>
            <div class="search-buttons">
                <button class="btn-google" onclick="startSearch()">Поиск аниме</button>
                <button class="btn-google" onclick="lucky()">Мне повезёт!</button>
            </div>
        </div>
    </div>

    <script>
        // Анимация цифр и шкалы
        function startLoading() {
            const bar = document.getElementById('progress-bar');
            const num = document.getElementById('loader-number');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            let count = 0;
            const duration = 2500; // 2.5 секунды
            const intervalTime = duration / 100;

            // Запускаем шкалу (CSS переход сделает всё плавно за 2.5с)
            setTimeout(() => {
                bar.style.width = '100%';
            }, 50);

            // Интервал для цифр
            const counter = setInterval(() => {
                count++;
                num.innerText = count + '%';
                if (count >= 100) {
                    clearInterval(counter);
                    finishLoading();
                }
            }, intervalTime);

            function finishLoading() {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        main.style.display = 'flex';
                        setTimeout(() => main.style.opacity = '1', 50);
                    }, 800);
                }, 300);
            }
        }

        window.onload = startLoading;

        // Функция поиска
        function startSearch() {
            const val = document.getElementById('searchInput').value;
            if(val) {
                alert('Ищем: ' + val + '\n(Здесь мы подключим ShikiVideo API)');
            }
        }

        function lucky() {
            alert('Случайное аниме загружается...');
        }
    </script>
</body>
</html>
