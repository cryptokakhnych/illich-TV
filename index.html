<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Illich TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background: #000; 
            color: white; 
            overflow: hidden;
            position: fixed;
            -webkit-text-size-adjust: 100%;
        }
        
        #bg-container { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; background: #000;
        }

        .background-fixed {
            width: 100%; height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/7E068F8D-434C-4D58-A6EB-587EF192B1E6%20(1).webp');
            background-position: center center; background-repeat: no-repeat; background-size: 100% 100%; 
            opacity: 0.6;
        }

        /* ЗАГРУЗОЧНЫЙ ЭКРАН */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/582912BF-C3C2-4689-B94E-BB11A3D639EF.webp') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-container {
            margin-bottom: 80px; /* Поднимаем шкалу чуть выше центра */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Обновленная шкала */
        .progress-box { 
            width: 220px; 
            height: 22px; /* Увеличили высоту для цифр */
            background: rgba(0,0,0,0.6); 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid rgba(0,212,255,0.4); 
            position: relative;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        /* Цифры по середине шкалы */
        #perc { 
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5; /* Поверх синей полоски */
            color: #fff; 
            font-weight: 900; 
            font-size: 14px; 
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        #bar {
            height: 100%;
            background: #00d4ff;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* КОНТЕНТ */
        #main-content { 
            display: none; width: 100%; height: 100%; flex-direction: column; 
            align-items: center; padding-top: 15px; position: relative; 
        }
        
        .top-bar { width: 94%; display: flex; gap: 10px; align-items: center; z-index: 100; height: 50px; margin-bottom: 15px; }

        .search-box { 
            flex: 1; display: flex; background: #fff; border-radius: 50px; 
            padding: 3px; box-shadow: 0 0 15px rgba(0,0,0,0.5); gap: 5px;
        }

        .search-box input { 
            flex: 1; border: none; outline: none; padding: 8px 12px; 
            font-size: 14px; border-radius: 50px; color: #000; min-width: 0; 
        }

        .search-btn { background: #00d4ff; color: #fff; border: none; padding: 0 12px; border-radius: 50px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .back-btn { background: #ff4b4b; color: #fff; border: none; padding: 0 12px; border-radius: 50px; font-weight: bold; font-size: 11px; cursor: pointer; }

        .menu-btn {
            width: 40px; height: 40px; background: rgba(0,0,0,0.7);
            border: 1px solid #00d4ff33; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 4px; cursor: pointer;
        }
        .menu-btn span { width: 20px; height: 2px; background: #00d4ff; border-radius: 2px; }

        #menu-overlay {
            display: none; position: fixed; top: 70px; right: 3%; width: 260px;
            background: rgba(15, 15, 15, 0.95); border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 15px; padding: 15px; z-index: 500; backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        
        .menu-item { 
            padding: 12px; 
            margin-bottom: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.3s;
            display: flex; 
            align-items: center; 
            gap: 10px;
            background: rgba(255,255,255,0.03);
        }
        .menu-item:active { background: rgba(0, 212, 255, 0.1); border-color: #00d4ff; }

        .auth-container { display: none; flex-direction: column; gap: 10px; padding: 5px 0; }
        .auth-container input { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; 
            background: #222; color: #fff; font-size: 13px; outline: none;
        }
        .auth-container button { 
            background: #00d4ff; color: #000; border: 1px solid #00d4ff; padding: 10px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .auth-back { font-size: 11px; text-align: center; color: #888; cursor: pointer; margin-top: 5px; }

        .glass-container {
            width: 94%; 
            height: 70vh;
            margin-bottom: 20px; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(5px);
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            min-height: 400px; 
        }

        .container-header { 
            padding: 15px 15px 10px 15px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .container-title { 
            font-size: 13px; 
            color: #00d4ff; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            font-weight: bold;
            text-align: center;
        }

        #results { 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            padding: 15px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            flex: 1;
        }

        .card { 
            background: rgba(0,0,0,0.3); border-radius: 12px; padding: 8px; 
            border: 1px solid rgba(255,255,255,0.1); text-align: center; 
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
        .card div { font-size: 11px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        #player-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 2000; }
        #player-iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 40px; right: 20px; background: #ff4b4b; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; z-index: 2100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body onclick="hideMenu()">

    <div id="bg-container"><div class="background-fixed"></div></div>

    <div id="splash-screen">
        <div id="loading-container">
            <div class="progress-box">
                <div id="perc">0%</div>
                <div id="bar"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="search-box" onclick="event.stopPropagation()">
                <input type="text" id="sInp" placeholder="Поиск аниме..." oninput="handleTyping(this.value)">
                <button class="search-btn" onclick="search(); closeKeyboard();">ПОИСК</button>
                <button class="back-btn" onclick="goHome();">НАЗАД</button>
            </div>
            <div class="menu-btn" onclick="event.stopPropagation(); toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div id="menu-overlay" onclick="event.stopPropagation()">
            <div id="guest-menu">
                <div class="menu-item" onclick="openAuth('login')">🔑 Вход</div>
                <div class="menu-item" onclick="openAuth('reg')">📝 Регистрация</div>
            </div>
            
            <div id="auth-form" class="auth-container">
                <h4 id="auth-title" style="text-align:center; margin-bottom:5px; font-size:14px;">Вход</h4>
                <input type="email" placeholder="Email" id="auth-email">
                <input type="password" placeholder="Пароль" id="auth-pass">
                <button id="auth-submit-btn" onclick="processAuth()">Подтвердить</button>
                <div class="auth-back" onclick="resetMenu()">← Назад</div>
            </div>

            <div id="user-menu" style="display:none">
                <div class="menu-item">👤 Профиль</div>
                <div class="menu-item">⭐ Избранные</div>
                <div class="menu-item">💬 Форум</div>
                <div class="menu-item" style="color:#ff4b4b; border-color: rgba(255, 75, 75, 0.4);" onclick="logout()">🚪 Выход</div>
            </div>
        </div>
        
        <div class="glass-container" id="glass">
            <div class="container-header">
                <div id="container-label" class="container-title">История просмотров</div>
            </div>
            <div id="results"></div>
        </div>
    </div>

    <div id="player-layer">
        <button class="close-btn" onclick="closeVideo()">✕ ЗАКРЫТЬ</button>
        <iframe id="player-iframe" allowfullscreen></iframe>
    </div>

    <script>
        let history = JSON.parse(localStorage.getItem('animeHistory')) || [];
        let isSearching = false;

        function lockHeight() {
            const glass = document.getElementById('glass');
            const currentHeight = window.innerHeight * 0.7; 
            glass.style.height = currentHeight + 'px';
        }

        window.addEventListener('load', () => { 
            renderHistory(); 
            lockHeight();
            const h = window.innerHeight;
            document.getElementById('bg-container').style.height = h + 'px';
        });

        function toggleMenu() {
            const m = document.getElementById('menu-overlay');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
        function hideMenu() { document.getElementById('menu-overlay').style.display = 'none'; }

        function openAuth(mode) {
            document.getElementById('guest-menu').style.display = 'none';
            document.getElementById('auth-form').style.display = 'flex';
            const title = document.getElementById('auth-title');
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'Войти' : 'Создать';
            title.innerText = mode === 'login' ? 'ВХОД' : 'РЕГИСТРАЦИЯ';
        }

        function resetMenu() {
            document.getElementById('auth-form').style.display = 'none';
            document.getElementById('user-menu').style.display = 'none';
            document.getElementById('guest-menu').style.display = 'block';
        }

        function processAuth() {
            document.getElementById('auth-form').style.display = 'none';
            document.getElementById('user-menu').style.display = 'block';
        }

        function logout() { resetMenu(); }

        function handleTyping(val) {
            if(val.trim().length > 0) {
                isSearching = true;
                document.getElementById('container-label').innerText = "Результаты поиска";
            } else {
                goHome();
            }
        }

        function goHome() {
            isSearching = false;
            document.getElementById('sInp').value = '';
            document.getElementById('container-label').innerText = "История просмотров";
            closeKeyboard();
            renderHistory();
        }

        function renderHistory() {
            const res = document.getElementById('results');
            res.innerHTML = '';
            if(history.length === 0) {
                res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:40px; opacity:0.3; font-size:12px;">История пуста</p>';
                return;
            }
            history.forEach(a => res.appendChild(createCard(a)));
        }

        function createCard(a) {
            const d = document.createElement('div');
            d.className = 'card';
            d.innerHTML = `<img src="${a.img}"><div>${a.title}</div>`;
            d.onclick = () => play(a.id, a.title, a.img);
            return d;
        }

        async function search() {
            const q = document.getElementById('sInp').value;
            if(!q.trim()) return;
            const res = document.getElementById('results');
            res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px;">Загрузка...</p>';
            try {
                const r = await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(q)}&limit=20`);
                const data = await r.json();
                res.innerHTML = '';
                if(data.length === 0) {
                    res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px;">Не найдено</p>';
                    return;
                }
                data.forEach(a => {
                    const obj = { id: a.id, title: a.russian || a.name, img: `https://shikimori.one${a.image.preview}` };
                    res.appendChild(createCard(obj));
                });
            } catch(e) { 
                res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px;">Ошибка</p>';
            }
        }

        function play(id, title, img) {
            const entry = { id, title, img };
            history = history.filter(item => item.id !== id); 
            history.unshift(entry);
            if(history.length > 20) history.pop(); 
            localStorage.setItem('animeHistory', JSON.stringify(history));
            const layer = document.getElementById('player-layer');
            const iframe = document.getElementById('player-iframe');
            layer.style.display = 'block';
            iframe.src = `https://pizdec.pro/id/${id}`;
        }

        function closeVideo() {
            document.getElementById('player-layer').style.display = 'none';
            document.getElementById('player-iframe').src = '';
            if(!isSearching) renderHistory();
        }

        function closeKeyboard() { document.getElementById('sInp').blur(); }

        let prog = 0;
        let loadInt = setInterval(() => {
            prog += 2;
            if (prog >= 100) {
                prog = 100;
                clearInterval(loadInt);
                setTimeout(() => {
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splash-screen').style.display = 'none';
                        document.getElementById('main-content').style.display = 'flex';
                    }, 500);
                }, 200);
            }
            document.getElementById('bar').style.width = prog + '%';
            document.getElementById('perc').innerText = prog + '%';
        }, 30);
    </script>
</body>
</html>
