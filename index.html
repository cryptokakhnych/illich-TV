<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Illich TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background: #000; 
            color: white; 
            overflow: hidden;
            position: fixed;
            -webkit-text-size-adjust: 100%;
        }
        
        #bg-container { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; background: #000;
        }

        .background-fixed {
            width: 100%; height: 100%;
            background-image: url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/7E068F8D-434C-4D58-A6EB-587EF192B1E6%20(1).webp');
            background-position: center center; background-repeat: no-repeat; background-size: 100% 100%; 
            opacity: 0.6;
        }

        /* ЗАГРУЗОЧНЫЙ ЭКРАН */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://cdn.jsdelivr.net/gh/cryptokakhnych/illich-TV@main/582912BF-C3C2-4689-B94E-BB11A3D639EF.webp') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #perc { color: #00d4ff; font-weight: 900; margin-bottom: 2px; font-size: 18px; text-shadow: 1px 1px 2px #000; }
        .progress-box { width: 200px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,212,255,0.3); }

        /* КОНТЕНТ */
        #main-content { 
            display: none; width: 100%; height: 100%; flex-direction: column; 
            align-items: center; padding-top: 15px; position: relative; 
        }
        
        .top-bar { width: 94%; display: flex; gap: 10px; align-items: center; z-index: 100; margin-bottom: 15px; }

        .search-box { 
            flex: 1; display: flex; background: #fff; border-radius: 50px; 
            padding: 3px; box-shadow: 0 0 15px rgba(0,0,0,0.5); gap: 5px;
        }

        .search-box input { 
            flex: 1; border: none; outline: none; padding: 8px 12px; 
            font-size: 14px; border-radius: 50px; color: #000; min-width: 0; 
        }

        .search-btn { background: #00d4ff; color: #fff; border: none; padding: 0 12px; border-radius: 50px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .back-btn { background: #ff4b4b; color: #fff; border: none; padding: 0 12px; border-radius: 50px; font-weight: bold; font-size: 11px; cursor: pointer; }

        .menu-btn {
            width: 40px; height: 40px; background: rgba(0,0,0,0.7);
            border: 1px solid #00d4ff33; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 4px; cursor: pointer;
        }
        .menu-btn span { width: 20px; height: 2px; background: #00d4ff; border-radius: 2px; }

        /* ОКНО МЕНЮ */
        #menu-overlay {
            display: none; position: fixed; top: 70px; right: 3%; width: 250px;
            background: rgba(0,0,0,0.95); border: 1px solid rgba(0,212,255,0.3);
            border-radius: 15px; padding: 15px; z-index: 500; backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .menu-item { 
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; font-size: 14px; transition: background 0.2s;
        }
        .menu-item:last-child { border: none; }
        .menu-item:active { background: rgba(0,212,255,0.1); }

        /* ФОРМЫ АВТОРИЗАЦИИ */
        .auth-form { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
        .auth-form input { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; outline: none; }
        .auth-form button { background: #00d4ff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* ОБВОДКА И РЕЗУЛЬТАТЫ */
        .glass-container {
            flex: 1; width: 94%; margin-bottom: 20px; background: transparent; 
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); 
            overflow: hidden; display: flex; flex-direction: column;
        }
        .container-title { padding: 15px 15px 5px 15px; font-size: 11px; color: #00d4ff; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; }

        #results { 
            width: 100%; display: grid; grid-template-columns: 1fr 1fr; 
            gap: 12px; padding: 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; 
        }

        .card { 
            background: rgba(255,255,255,0.05); border-radius: 10px; padding: 6px; 
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
            height: fit-content;
        }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; display: block; }
        .card div { font-size: 10px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eee; }

        /* ПЛЕЕР */
        #player-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 2000; }
        #player-iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 40px; right: 20px; background: #ff4b4b; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; z-index: 2100; box-shadow: 0 0 15px rgba(255,75,75,0.4); }
    </style>
</head>
<body onclick="hideMenu()">

    <div id="bg-container"><div class="background-fixed"></div></div>

    <div id="splash-screen">
        <div id="loading-container">
            <div id="perc">0%</div>
            <div class="progress-box"><div id="bar" style="width: 0%; height: 100%; background: #00d4ff; transition: width 0.1s linear;"></div></div>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="search-box" onclick="event.stopPropagation()">
                <input type="text" id="sInp" placeholder="Найти аниме..." oninput="handleSearchInput(this.value)">
                <button class="search-btn" onclick="search(); closeKeyboard();">ПОИСК</button>
                <button class="back-btn" onclick="goHome();">НАЗАД</button>
            </div>
            <div class="menu-btn" onclick="event.stopPropagation(); toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div id="menu-overlay" onclick="event.stopPropagation()">
            <div id="guest-menu">
                <div class="menu-item" onclick="showAuth('login')">Вход</div>
                <div class="menu-item" onclick="showAuth('reg')">Регистрация</div>
            </div>
            <div id="user-menu" style="display:none">
                <div class="menu-item">👤 Профиль</div>
                <div class="menu-item">⭐ Избранные</div>
                <div class="menu-item">💬 Форум</div>
                <div class="menu-item" style="color:#ff4b4b" onclick="logout()">Выход</div>
            </div>
            <div id="auth-form-container" class="auth-form">
                <h3 id="form-title" style="font-size:14px; text-align:center; color:#00d4ff"></h3>
                <input type="email" id="emailField" placeholder="Email">
                <input type="password" id="passField" placeholder="Пароль">
                <button id="submitBtn" onclick="submitAuth()">Войти</button>
                <div class="menu-item" style="font-size:11px; text-align:center; border:none; margin-top:5px" onclick="cancelAuth()">Назад к меню</div>
            </div>
        </div>
        
        <div class="glass-container">
            <div id="container-label" class="container-title">История просмотров</div>
            <div id="results"></div>
        </div>
    </div>

    <div id="player-layer">
        <button class="close-btn" onclick="closeVideo()">✕ ЗАКРЫТЬ</button>
        <iframe id="player-iframe" allowfullscreen></iframe>
    </div>

    <script>
        let history = JSON.parse(localStorage.getItem('animeHistory')) || [];

        window.addEventListener('load', () => { 
            const h = window.innerHeight;
            document.getElementById('bg-container').style.height = h + 'px';
            renderHistory(); 
        });

        // --- ЛОГИКА МЕНЮ ---
        function toggleMenu() {
            const m = document.getElementById('menu-overlay');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
        function hideMenu() { document.getElementById('menu-overlay').style.display = 'none'; }

        function showAuth(type) {
            document.getElementById('guest-menu').style.display = 'none';
            document.getElementById('auth-form-container').style.display = 'flex';
            document.getElementById('form-title').innerText = (type === 'login' ? 'ВХОД' : 'РЕГИСТРАЦИЯ');
            document.getElementById('submitBtn').innerText = (type === 'login' ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ');
        }

        function cancelAuth() {
            document.getElementById('auth-form-container').style.display = 'none';
            document.getElementById('guest-menu').style.display = 'block';
        }

        function submitAuth() {
            // Имитация входа
            document.getElementById('auth-form-container').style.display = 'none';
            document.getElementById('user-menu').style.display = 'block';
        }

        function logout() {
            document.getElementById('user-menu').style.display = 'none';
            document.getElementById('guest-menu').style.display = 'block';
        }

        // --- ЛОГИКА ПОИСКА И ИСТОРИИ ---
        function handleSearchInput(val) {
            if(!val.trim()) {
                renderHistory();
            } else {
                document.getElementById('container-label').innerText = "Результаты поиска";
            }
        }

        function renderHistory() {
            document.getElementById('container-label').innerText = "История просмотров";
            const res = document.getElementById('results');
            res.innerHTML = '';
            if(history.length === 0) {
                res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:30px; opacity:0.3; font-size:12px">История пуста</p>';
                return;
            }
            history.forEach(a => {
                res.appendChild(createCard(a));
            });
        }

        function createCard(a) {
            const d = document.createElement('div');
            d.className = 'card';
            d.innerHTML = `<img src="${a.img}"><div>${a.title}</div>`;
            d.onclick = (e) => { e.stopPropagation(); play(a.id, a.title, a.img); };
            return d;
        }

        function goHome() {
            document.getElementById('sInp').value = '';
            closeKeyboard();
            renderHistory();
        }

        async function search() {
            const q = document.getElementById('sInp').value;
            if(!q.trim()) return;
            const res = document.getElementById('results');
            res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px; font-size:12px">Загрузка...</p>';
            
            try {
                const r = await fetch(`https://shikimori.one/api/animes?search=${encodeURIComponent(q)}&limit=20`);
                const data = await r.json();
                res.innerHTML = '';
                if(data.length === 0) {
                    res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px; font-size:12px">Ничего не найдено</p>';
                    return;
                }
                data.forEach(a => {
                    const obj = { id: a.id, title: a.russian || a.name, img: `https://shikimori.one${a.image.preview}` };
                    res.appendChild(createCard(obj));
                });
            } catch(e) { 
                res.innerHTML = '<p style="grid-column: 1/3; text-align:center; padding:20px; font-size:12px">Ошибка сети</p>';
            }
        }

        function play(id, title, img) {
            // Добавляем в историю
            const entry = { id, title, img };
            history = history.filter(item => item.id !== id); 
            history.unshift(entry);
            if(history.length > 20) history.pop();
            localStorage.setItem('animeHistory', JSON.stringify(history));

            const layer = document.getElementById('player-layer');
            const iframe = document.getElementById('player-iframe');
            layer.style.display = 'block';
            iframe.src = `https://pizdec.pro/id/${id}`;
        }

        function closeVideo() {
            document.getElementById('player-layer').style.display = 'none';
            document.getElementById('player-iframe').src = '';
            if(!document.getElementById('sInp').value.trim()) renderHistory();
        }

        function closeKeyboard() { document.getElementById('sInp').blur(); }

        // ЗАГРУЗКА
        let prog = 0;
        let loadInt = setInterval(() => {
            prog += 2.5;
            if (prog >= 100) {
                prog = 100;
                clearInterval(loadInt);
                setTimeout(() => {
                    document.getElementById('splash-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('splash-screen').style.display = 'none';
                        document.getElementById('main-content').style.display = 'flex';
                    }, 500);
                }, 200);
            }
            document.getElementById('bar').style.width = prog + '%';
            document.getElementById('perc').innerText = Math.floor(prog) + '%';
        }, 40);
    </script>
</body>
</html>
